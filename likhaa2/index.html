<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Likha.ph | AI Chatbot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    .chatbox {
      width: 350px;
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,.2);
    }

    .chat-header {
      background: #111;
      color: #fff;
      padding: 12px;
      border-radius: 10px 10px 0 0;
    }

    .chat-body {
      height: 280px;
      overflow-y: auto;
      padding: 10px;
      font-size: 14px;
    }

    .chat-footer {
      display: flex;
      border-top: 1px solid #ccc;
    }

    .chat-footer input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
    }

    .chat-footer button {
      background: #e63946;
      color: #fff;
      border: none;
      padding: 10px 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="chatbox">
  <div class="chat-header">Likha AI Assistant</div>

  <div class="chat-body" id="chatBody">
    <p><strong>Likha AI:</strong> Hello! I’m here to help you with Likha.ph. Ask me anything.</p>
  </div>

  <div class="chat-footer">
    <input type="text" id="chatInput" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
async function sendMessage() {
  const input = document.getElementById("chatInput");
  const body = document.getElementById("chatBody");

  if (!input.value.trim()) return;

  body.innerHTML += `<p><strong>You:</strong> ${input.value}</p>`;

  try {
    const response = await fetch("chat.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: input.value })
    });

    const data = await response.json();
    body.innerHTML += `<p><strong>Likha AI:</strong> ${data.reply}</p>`;
  } catch {
    body.innerHTML += `<p><strong>Likha AI:</strong> Unable to connect.</p>`;
  }

  input.value = "";
  body.scrollTop = body.scrollHeight;
}
</script>

</body>
</html>
